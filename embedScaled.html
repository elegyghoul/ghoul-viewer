<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhoulViewer embed scaled</title>
    <style>
      /* Demo page shell only. The viewer UI and its CSS live in the div. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Fit the window. 315×200 includes the id bar above the 315×184 shell. */
      #ghoul {
        width: min(100%, calc(100svh * 315 / 200));
        max-height: 100%;
        aspect-ratio: 315 / 200;
      }
    </style>
  </head>
  <body>
    <div id="ghoul" data-ghoul-viewer data-scale="fit" data-id-picker></div>
    <script
      type="module"
      src="/src/embed-boot.ts"
      data-target="#ghoul"
      data-scale="fit"
      data-id-picker
    ></script>
  </body>
</html>
